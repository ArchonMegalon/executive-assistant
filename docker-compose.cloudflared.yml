services:
  ea-api:
    environment:
      - EA_TRUST_PROXY_HEADERS=1
      - EA_TRUSTED_PROXY_CIDRS=${EA_PUBLIC_INGRESS_TRUSTED_PROXY_CIDRS:-172.31.254.2/32}

  ea-cloudflared:
    image: cloudflare/cloudflared:latest@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    container_name: externalbrain-cloudflared
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    command: tunnel run
    cap_drop:
      - ALL
    environment:
      - TUNNEL_TOKEN=${EA_CF_TUNNEL_TOKEN}
    security_opt:
      - no-new-privileges:true
    networks:
      public_ingress:
        ipv4_address: ${EA_PUBLIC_INGRESS_CLOUDFLARED_IPV4:-172.31.254.2}
      property_default: {}

networks:
  property_default:
    external: true
    name: property_default
