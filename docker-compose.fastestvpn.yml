services:
  ea-docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    # Upstream writes its rendered HAProxy config beside the image template.
    # Keep the rootfs read-only and render the same config into ephemeral /run.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        disable_ipv6_lower="$$(printf '%s' "$${DISABLE_IPV6:-}" | tr '[:upper:]' '[:lower:]')"
        case "$${disable_ipv6_lower}" in
          1|true|yes) bind_config=':2375' ;;
          *) bind_config='[::]:2375 v4v6' ;;
        esac
        sed 's/$${BIND_CONFIG}/'"$${bind_config}"'/g' \
          /usr/local/etc/haproxy/haproxy.cfg.template > /run/haproxy.cfg
        exec haproxy -W -db -f /run/haproxy.cfg
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - INFO=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run

  # Switzerland is the only governed FastestVPN lane in this overlay. It is
  # intentionally not a dependency of the API: normal EA startup must remain
  # available when the optional transport is down, while 1min refreshes fail
  # closed on an unreachable configured proxy.
  ea-fastestvpn-proxy-ch:
    build:
      context: .
      dockerfile: docker/fastestvpn-proxy/Dockerfile
    image: ea-fastestvpn-proxy:latest
    container_name: ea-fastestvpn-proxy-ch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FASTESTVPN_CONFIG_DIR=/vpn/fastestvpn
      - FASTESTVPN_CONFIG_GLOB=${FASTESTVPN_CH_CONFIG_GLOB:-switzerland*.ovpn}
      - FASTESTVPN_CONFIG_SELECT_MODE=${FASTESTVPN_CONFIG_SELECT_MODE:-random}
      - FASTESTVPN_CONFIG_FILE=
      - FASTESTVPN_PROXY_PORT=${FASTESTVPN_PROXY_PORT:-3128}
      - FASTESTVPN_PROXY_LISTEN=0.0.0.0
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./vpn/fastestvpn:/vpn/fastestvpn:ro
      - ea_fastestvpn_state_ch:/state
    ports:
      - "127.0.0.1:${FASTESTVPN_CH_PROXY_HOST_PORT:-9315}:${FASTESTVPN_PROXY_PORT:-3128}"
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Initialization Sequence Completed' /tmp/openvpn.log && nc -z 127.0.0.1 ${FASTESTVPN_PROXY_PORT:-3128}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The API owns the explicit operator-triggered 1min refresh route. Worker,
  # scheduler, WhatsApp, browser UI, and public ingress are not placed behind
  # this provider transport.
  ea-api:
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    environment:
      - ONEMIN_DIRECT_API_PROXY_SERVER=http://ea-fastestvpn-proxy-ch:${FASTESTVPN_PROXY_PORT:-3128}
      - ONEMIN_DIRECT_API_PROXY_POOL=http://ea-fastestvpn-proxy-ch:${FASTESTVPN_PROXY_PORT:-3128}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    # The exact compose inputs are baked into ea-runtime for both on-demand
    # rotation and runtime attestation. Keep only provider material mutable.
    volumes:
      - ./vpn/fastestvpn:/app/vpn/fastestvpn:ro

volumes:
  ea_fastestvpn_state_ch: {}
