      - EA_WHATSAPP_WEB_ACTION_MESSAGE_TAKE=${EA_WHATSAPP_WEB_ACTION_MESSAGE_TAKE:-100}
      - EA_WHATSAPP_WEB_TG_SUMMARY_ENABLED=${EA_WHATSAPP_WEB_TG_SUMMARY_ENABLED:-0}
      - EA_WHATSAPP_WEB_TG_SUMMARY_EVERY=${EA_WHATSAPP_WEB_TG_SUMMARY_EVERY:-5}
      - EA_WHATSAPP_WEB_TG_SUMMARY_CHAT_ID=${EA_WHATSAPP_WEB_TG_SUMMARY_CHAT_ID:-}
      - EA_WHATSAPP_WEB_TG_SUMMARY_BOT_TOKEN=${EA_WHATSAPP_WEB_TG_SUMMARY_BOT_TOKEN:-}
      - EA_WHATSAPP_WEB_TG_SUMMARY_TIMEOUT_SECONDS=${EA_WHATSAPP_WEB_TG_SUMMARY_TIMEOUT_SECONDS:-15}
      - EA_WHATSAPP_WEB_TG_SUMMARY_HEYY_AI_KEYS=${EA_WHATSAPP_WEB_TG_SUMMARY_HEYY_AI_KEYS:-empathetic_slow_typing_old_lady}
      - EA_WHATSAPP_WEB_TG_SUMMARY_SCOPE_LABEL=${EA_WHATSAPP_WEB_TG_SUMMARY_SCOPE_LABEL:-Herta}
      - EA_WHATSAPP_WEB_ACTION_REPLY_HEYY_AI_KEY=${EA_WHATSAPP_WEB_ACTION_REPLY_HEYY_AI_KEY:-empathetic_slow_typing_old_lady}
      - EA_WHATSAPP_WEB_ACTION_REPLY_HEYY_AI_NAME=${EA_WHATSAPP_WEB_ACTION_REPLY_HEYY_AI_NAME:-Herta (Heyy Lady)}
      - EA_WHATSAPP_WEB_ACTION_REPLY_PRE_REPLY_DELAY_MIN_SECONDS=${EA_WHATSAPP_WEB_ACTION_REPLY_PRE_REPLY_DELAY_MIN_SECONDS:-180}
      - EA_WHATSAPP_WEB_ACTION_REPLY_PRE_REPLY_DELAY_MAX_SECONDS=${EA_WHATSAPP_WEB_ACTION_REPLY_PRE_REPLY_DELAY_MAX_SECONDS:-1800}
      - EA_WHATSAPP_WEB_ACTION_REPLY_QUIET_HOURS_START_HOUR=${EA_WHATSAPP_WEB_ACTION_REPLY_QUIET_HOURS_START_HOUR:-21}
      - EA_WHATSAPP_WEB_ACTION_REPLY_QUIET_HOURS_END_HOUR=${EA_WHATSAPP_WEB_ACTION_REPLY_QUIET_HOURS_END_HOUR:-6}
      - EA_WHATSAPP_WEB_ACTION_REPLY_TYPING_DELAY_MS=${EA_WHATSAPP_WEB_ACTION_REPLY_TYPING_DELAY_MS:-6500}
      - EA_WHATSAPP_WEB_ACTION_REPLY_TYPING_DELAY_MS_PER_CHARACTER=${EA_WHATSAPP_WEB_ACTION_REPLY_TYPING_DELAY_MS_PER_CHARACTER:-8000}
      - EA_WHATSAPP_WEB_ACTION_REPLY_TYPING_STATUS_ENABLED=${EA_WHATSAPP_WEB_ACTION_REPLY_TYPING_STATUS_ENABLED:-1}
      - EA_WHATSAPP_WEB_ACTION_REPLY_USE_SIDECAR_ROUTE_PACING=${EA_WHATSAPP_WEB_ACTION_REPLY_USE_SIDECAR_ROUTE_PACING:-0}
      - EA_WHATSAPP_WEB_DEFAULT_PRINCIPAL_ID=${EA_WHATSAPP_WEB_DEFAULT_PRINCIPAL_ID:-principal-default}
      - EA_WHATSAPP_WEB_DEFAULT_SESSION_REF=${EA_WHATSAPP_WEB_DEFAULT_SESSION_REF:-default-wa-web}
      - EA_WHATSAPP_WEB_SESSION_API_BASE_URL=${EA_WHATSAPP_WEB_SESSION_API_BASE_URL:-http://ea-whatsapp-web-session:8098}
      - EA_WHATSAPP_WEB_SESSION_API_TOKEN=${EA_WHATSAPP_WEB_SESSION_API_TOKEN:-}
      - EA_WHATSAPP_AUDIOBOOK_RESUME_DUE=${EA_WHATSAPP_AUDIOBOOK_RESUME_DUE:-1}
      - EA_WHATSAPP_AUDIOBOOK_RESUME_DUE_LIMIT=${EA_WHATSAPP_AUDIOBOOK_RESUME_DUE_LIMIT:-1}
      - EA_WHATSAPP_AUDIOBOOK_FOLLOWUP_ENABLED=${EA_WHATSAPP_AUDIOBOOK_FOLLOWUP_ENABLED:-1}
      - EA_WHATSAPP_AUDIOBOOK_FOLLOWUP_LIMIT=${EA_WHATSAPP_AUDIOBOOK_FOLLOWUP_LIMIT:-3}
      - EA_AUDIOBOOK_EXTERNAL_TTS_ENABLED=${EA_AUDIOBOOK_EXTERNAL_TTS_ENABLED:-1}
      - EA_AUDIOBOOK_JOBS_ROOT=${EA_AUDIOBOOK_JOBS_ROOT:-/data/audiobooks/jobs}
      - EA_AUDIOBOOK_CANARY_RECEIPT_HMAC_KEY=${EA_AUDIOBOOK_CANARY_RECEIPT_HMAC_KEY:-}
      - EA_AUDIOBOOK_UNMIXR_AUTO_RENDER=${EA_AUDIOBOOK_UNMIXR_AUTO_RENDER:-1}
      - EA_AUDIOBOOK_UNMIXR_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_UNMIXR_MAX_CHARS_PER_REQUEST:-1800}
      - VOCALLAB_API_KEY=${VOCALLAB_API_KEY:-}
      - VOCALLAB_API_KEY_FILE=${VOCALLAB_API_KEY_FILE:-config/vocallab_api_key}
      - EA_AUDIOBOOK_VOCALLAB_ENABLED=${EA_AUDIOBOOK_VOCALLAB_ENABLED:-0}
      - EA_AUDIOBOOK_VOCALLAB_AUTO_RENDER=${EA_AUDIOBOOK_VOCALLAB_AUTO_RENDER:-0}
      - EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_ROTATION_REQUIRED=${EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_ROTATION_REQUIRED:-1}
      - EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_PRODUCTION_ELIGIBLE=${EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_PRODUCTION_ELIGIBLE:-0}
      - EA_AUDIOBOOK_VOCALLAB_BASE_URL=${EA_AUDIOBOOK_VOCALLAB_BASE_URL:-https://api.vocallab.ai}
      - EA_AUDIOBOOK_VOCALLAB_MODEL=${EA_AUDIOBOOK_VOCALLAB_MODEL:-v-pro}
      - EA_AUDIOBOOK_VOCALLAB_EXPRESSIVE_MODEL=${EA_AUDIOBOOK_VOCALLAB_EXPRESSIVE_MODEL:-v-studio}
      - EA_AUDIOBOOK_VOCALLAB_DRAFT_MODEL=${EA_AUDIOBOOK_VOCALLAB_DRAFT_MODEL:-v-lite}
      - EA_AUDIOBOOK_VOCALLAB_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_VOCALLAB_MAX_CHARS_PER_REQUEST:-1800}
      - EA_AUDIOBOOK_VOCALLAB_REQUESTS_PER_MINUTE=${EA_AUDIOBOOK_VOCALLAB_REQUESTS_PER_MINUTE:-30}
      - EA_AUDIOBOOK_VOCALLAB_MAX_IN_FLIGHT=${EA_AUDIOBOOK_VOCALLAB_MAX_IN_FLIGHT:-1}
      - EA_AUDIOBOOK_VOCALLAB_MAX_SEGMENTS_PER_RUN=${EA_AUDIOBOOK_VOCALLAB_MAX_SEGMENTS_PER_RUN:-10}
      - EA_AUDIOBOOK_VOCALLAB_TIMEOUT_SECONDS=${EA_AUDIOBOOK_VOCALLAB_TIMEOUT_SECONDS:-120}
      - EA_AUDIOBOOK_VOCALLAB_POLL_INTERVAL_SECONDS=${EA_AUDIOBOOK_VOCALLAB_POLL_INTERVAL_SECONDS:-2}
      - EA_AUDIOBOOK_VOCALLAB_POLL_TIMEOUT_SECONDS=${EA_AUDIOBOOK_VOCALLAB_POLL_TIMEOUT_SECONDS:-180}
      - EA_AUDIOBOOK_VOCALLAB_OUTPUT_FORMAT=${EA_AUDIOBOOK_VOCALLAB_OUTPUT_FORMAT:-WAV}
      - EA_AUDIOBOOK_VOCALLAB_SAMPLE_RATE=${EA_AUDIOBOOK_VOCALLAB_SAMPLE_RATE:-44100}
      - EA_AUDIOBOOK_VOCALLAB_MAX_AUDIO_BYTES=${EA_AUDIOBOOK_VOCALLAB_MAX_AUDIO_BYTES:-33554432}
      - EA_AUDIOBOOK_VOCALLAB_MIN_REMAINING_POINTS=${EA_AUDIOBOOK_VOCALLAB_MIN_REMAINING_POINTS:-3000}
      - EA_AUDIOBOOK_VOCALLAB_MAX_POINTS_PER_JOB=${EA_AUDIOBOOK_VOCALLAB_MAX_POINTS_PER_JOB:-6000}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_TOPUP_POINTS=${EA_AUDIOBOOK_VOCALLAB_ALLOW_TOPUP_POINTS:-0}
      - EA_AUDIOBOOK_VOCALLAB_ALLOWED_VOICE_CLASSES=${EA_AUDIOBOOK_VOCALLAB_ALLOWED_VOICE_CLASSES:-professional,consented_clone}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_COMMUNITY_VOICES=${EA_AUDIOBOOK_VOCALLAB_ALLOW_COMMUNITY_VOICES:-0}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_CLONES=${EA_AUDIOBOOK_VOCALLAB_ALLOW_CLONES:-0}
      - EA_AUDIOBOOK_VOCALLAB_VOICE_CATALOG_FILE=${EA_AUDIOBOOK_VOCALLAB_VOICE_CATALOG_FILE:-config/vocallab_voice_catalog.local.json}
      - EA_AUDIOBOOK_TTS_PROVIDER_ORDER=${EA_AUDIOBOOK_TTS_PROVIDER_ORDER:-unmixr,vocallab,piper_local}
      - EA_AUDIOBOOK_TTS_ALLOW_CROSS_PROVIDER_FALLBACK=${EA_AUDIOBOOK_TTS_ALLOW_CROSS_PROVIDER_FALLBACK:-0}
      - EA_AUDIOBOOK_CINEMATIC_NARRATION=${EA_AUDIOBOOK_CINEMATIC_NARRATION:-1}
      - EA_AUDIOBOOK_CINEMATIC_SINGLE_PASS=${EA_AUDIOBOOK_CINEMATIC_SINGLE_PASS:-0}
      - EA_AUDIOBOOK_CINEMATIC_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_CINEMATIC_MAX_CHARS_PER_REQUEST:-1800}
      - EA_AUDIOBOOK_EBOOK_CONVERT_BIN=${EA_AUDIOBOOK_EBOOK_CONVERT_BIN:-ebook-convert}
      - EA_AUDIOBOOK_KINDLE_CONVERT_TIMEOUT_SECONDS=${EA_AUDIOBOOK_KINDLE_CONVERT_TIMEOUT_SECONDS:-900}
      - EA_AUDIOBOOK_PARAGRAPH_PAUSES_ENABLED=${EA_AUDIOBOOK_PARAGRAPH_PAUSES_ENABLED:-1}
      - EA_AUDIOBOOK_PARAGRAPH_PAUSE_SECONDS=${EA_AUDIOBOOK_PARAGRAPH_PAUSE_SECONDS:-0.45}
      - EA_WHATSAPP_WEB_ACTION_RETRY_ZERO_SAMPLE_AUDIOBOOK=${EA_WHATSAPP_WEB_ACTION_RETRY_ZERO_SAMPLE_AUDIOBOOK:-1}
      - EA_WHATSAPP_WEB_ACTION_ZERO_SAMPLE_RETRY_LIMIT=${EA_WHATSAPP_WEB_ACTION_ZERO_SAMPLE_RETRY_LIMIT:-1}
      - EA_WHATSAPP_WEB_ACTION_CONVERSATION_FALLBACK_NOOP_COOLDOWN_SECONDS=${EA_WHATSAPP_WEB_ACTION_CONVERSATION_FALLBACK_NOOP_COOLDOWN_SECONDS:-60}
      - EA_WHATSAPP_WEB_ACTION_CONVERSATION_FALLBACK_NOOP_MAX_COOLDOWN_SECONDS=${EA_WHATSAPP_WEB_ACTION_CONVERSATION_FALLBACK_NOOP_MAX_COOLDOWN_SECONDS:-300}
      - EA_AUDIOBOOK_PUBLICATION_STT_GATE_REQUIRED=${EA_AUDIOBOOK_PUBLICATION_STT_GATE_REQUIRED:-1}
      - EA_AUDIOBOOK_PUBLICATION_STT_GATE_ENABLED=${EA_AUDIOBOOK_PUBLICATION_STT_GATE_ENABLED:-0}
      - EA_AUDIOBOOK_PUBLICATION_STT_COMMAND=${EA_AUDIOBOOK_PUBLICATION_STT_COMMAND:-}
      - EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_COUNT=${EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_COUNT:-3}
      - EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_SECONDS=${EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_SECONDS:-30}
      - EA_AUDIOBOOK_PUBLICATION_STT_MIN_BOOK_TOKEN_OVERLAP=${EA_AUDIOBOOK_PUBLICATION_STT_MIN_BOOK_TOKEN_OVERLAP:-0.55}
      - EA_AUDIOBOOKSHELF_AUTO_IMPORT=${EA_AUDIOBOOKSHELF_AUTO_IMPORT:-1}
      - EA_AUDIOBOOK_DURABLE_STORAGE_ROOT=${EA_AUDIOBOOK_DURABLE_STORAGE_ROOT:-/data/audiobooks}
      - EA_AUDIOBOOKSHELF_IMPORT_ROOT=${EA_AUDIOBOOKSHELF_IMPORT_ROOT:-/data/audiobooks/audiobookshelf}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_ENABLED=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_ENABLED:-1}
      - EA_AUDIOBOOKSHELF_API_BASE_URL=${EA_AUDIOBOOKSHELF_API_BASE_URL:-}
      - EA_AUDIOBOOKSHELF_PUBLIC_BASE_URL=${EA_AUDIOBOOKSHELF_PUBLIC_BASE_URL:-}
      - EA_AUDIOBOOKSHELF_API_TOKEN=${EA_AUDIOBOOKSHELF_API_TOKEN:-}
      - EA_AUDIOBOOKSHELF_LIBRARY_ID=${EA_AUDIOBOOKSHELF_LIBRARY_ID:-}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_EXPIRES_DAYS=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_EXPIRES_DAYS:-30}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_DOWNLOADABLE=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_DOWNLOADABLE:-0}
      - EA_AUDIOBOOK_ACCESS_SIGNING_SECRET=${EA_SIGNING_SECRET:-}
      - EA_AUDIOBOOK_ACCESS_EXPIRES_DAYS=${EA_AUDIOBOOK_ACCESS_EXPIRES_DAYS:-30}
      - EA_AUDIOBOOK_PLAYER_ACCESS_BASE_URL=${EA_AUDIOBOOK_PLAYER_ACCESS_BASE_URL:-}
      - EA_WHATSAPP_AUDIOBOOK_CALLBACK_SECRET_FILE=/run/secrets/whatsapp_audiobook_callback_secret
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/whatsapp-actions
      - PYTHONPATH=/app/ea
      - TZ=Europe/Vienna
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./:/app:ro
      - ${EA_WHATSAPP_AUDIOBOOK_CALLBACK_SECRET_RUNTIME_FILE:-./.runtime/secrets/whatsapp_audiobook_callback_secret}:/run/secrets/whatsapp_audiobook_callback_secret:ro
      - ea_whatsapp_web_actions:/data/whatsapp-actions
      - ${EA_DURABLE_AUDIOBOOK_HOST_ROOT:-./data/audiobooks}:/data/audiobooks
      - ${EA_AUDIOBOOK_JOBS_HOST_ROOT:-./data/audiobooks/jobs}:/data/audiobooks/jobs
      - ${EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT:-./data/audiobooks/audiobookshelf}:/data/audiobooks/audiobookshelf
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${EA_WHATSAPP_WEB_ACTION_PROCESSOR_ENABLED:-1}" != "1" ]; then
          echo '{"enabled":false,"event":"whatsapp_web_action_processor_idle","ok":true}';
          while :; do sleep 3600; done;
        fi
        if command -v ionice >/dev/null 2>&1; then
          lowprio='nice -n 10 ionice -c 3';
        else
          lowprio='nice -n 10';
        fi
        while :; do
          $${lowprio} python /app/scripts/process_whatsapp_web_session_actions.py || true;
          sleep "$${EA_WHATSAPP_WEB_ACTION_POLL_INTERVAL_SECONDS:-30}";
        done
    depends_on:
      ea-whatsapp-web-session:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python /app/scripts/check_whatsapp_web_action_processor_readiness.py --probe-sidecar --healthcheck
      interval: 2m
      timeout: 10s
      retries: 5

  ea-whatsapp-web-teable-sync:
    image: ea-runtime:latest
    container_name: ea-whatsapp-web-teable-sync
    restart: unless-stopped
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
    working_dir: /app
    cpu_shares: ${EA_WHATSAPP_WEB_TEABLE_SYNC_CPU_SHARES:-32}
    cpus: ${EA_WHATSAPP_WEB_TEABLE_SYNC_CPUS:-0.50}
    environment:
      - EA_WHATSAPP_WEB_TEABLE_SYNC_ENABLED=${EA_WHATSAPP_WEB_TEABLE_SYNC_ENABLED:-0}
      - VOCALLAB_API_KEY=
      - VOCALLAB_API_KEY_FILE=
      - EA_WHATSAPP_WEB_TEABLE_SYNC_INTERVAL_SECONDS=${EA_WHATSAPP_WEB_TEABLE_SYNC_INTERVAL_SECONDS:-30}
      - EA_WHATSAPP_WEB_TEABLE_BASE_ID=${EA_WHATSAPP_WEB_TEABLE_BASE_ID:-}
      - EA_WHATSAPP_WEB_MESSAGES_TEABLE_TABLE_ID=${EA_WHATSAPP_WEB_MESSAGES_TEABLE_TABLE_ID:-}
      - EA_WHATSAPP_WEB_ROUTES_TEABLE_TABLE_ID=${EA_WHATSAPP_WEB_ROUTES_TEABLE_TABLE_ID:-}
      - EA_HEYY_AI_PERSONAS_TEABLE_TABLE_ID=${EA_HEYY_AI_PERSONAS_TEABLE_TABLE_ID:-}
      - EA_WHATSAPP_WEB_HEYY_AI_ROUTE_SEEDS_JSON=${EA_WHATSAPP_WEB_HEYY_AI_ROUTE_SEEDS_JSON:-}
      - EA_WHATSAPP_WEB_HEYY_AI_ROUTE_SEEDS_FILE=${EA_WHATSAPP_WEB_HEYY_AI_ROUTE_SEEDS_FILE:-}
      - EA_WHATSAPP_WEB_ROUTE_IMPORT_SOURCES_JSON=${EA_WHATSAPP_WEB_ROUTE_IMPORT_SOURCES_JSON:-}
      - EA_WHATSAPP_WEB_ROUTE_IMPORT_SOURCES_FILE=${EA_WHATSAPP_WEB_ROUTE_IMPORT_SOURCES_FILE:-}
      - EA_WHATSAPP_WEB_SESSION_API_BASE_URL=${EA_WHATSAPP_WEB_SESSION_API_BASE_URL:-http://ea-whatsapp-web-session:8098}
      - EA_WHATSAPP_WEB_DEFAULT_SESSION_REF=${EA_WHATSAPP_WEB_DEFAULT_SESSION_REF:-default-wa-web}
      - EA_WHATSAPP_WEB_TEABLE_CONVERSATION_TAKE=${EA_WHATSAPP_WEB_TEABLE_CONVERSATION_TAKE:-25}
      - EA_WHATSAPP_WEB_TEABLE_MESSAGE_LIMIT=${EA_WHATSAPP_WEB_TEABLE_MESSAGE_LIMIT:-50}
      - EA_WHATSAPP_WEB_TEABLE_MAX_MESSAGE_ROWS_PER_RUN=${EA_WHATSAPP_WEB_TEABLE_MAX_MESSAGE_ROWS_PER_RUN:-40}
      - EA_WHATSAPP_WEB_TEABLE_SYNC_ALL_CONVERSATIONS=${EA_WHATSAPP_WEB_TEABLE_SYNC_ALL_CONVERSATIONS:-1}
      - EA_WHATSAPP_WEB_TEABLE_CONVERSATION_MAX_PAGES=${EA_WHATSAPP_WEB_TEABLE_CONVERSATION_MAX_PAGES:-1}
      - EA_WHATSAPP_WEB_TEABLE_CONVERSATION_FETCH_TIMEOUT_MS=${EA_WHATSAPP_WEB_TEABLE_CONVERSATION_FETCH_TIMEOUT_MS:-15000}
      - EA_WHATSAPP_WEB_TEABLE_CONVERSATION_FETCH_CONCURRENCY=${EA_WHATSAPP_WEB_TEABLE_CONVERSATION_FETCH_CONCURRENCY:-6}
      - EA_WHATSAPP_WEB_TEABLE_COMPLETED_REFRESH_CONVERSATION_TAKE=${EA_WHATSAPP_WEB_TEABLE_COMPLETED_REFRESH_CONVERSATION_TAKE:-5}
      - EA_WHATSAPP_WEB_TEABLE_SYNC_STATE_FILE=${EA_WHATSAPP_WEB_TEABLE_SYNC_STATE_FILE:-/data/whatsapp-teable-sync/state.json}
      - EA_WHATSAPP_WEB_TEABLE_SYNC_RUN_TIMEOUT_SECONDS=${EA_WHATSAPP_WEB_TEABLE_SYNC_RUN_TIMEOUT_SECONDS:-300}
      - EA_WHATSAPP_WEB_TEABLE_SYNC_STALE_SECONDS=${EA_WHATSAPP_WEB_TEABLE_SYNC_STALE_SECONDS:-600}
      - EA_WHATSAPP_WEB_TEABLE_SKIP_MESSAGES=${EA_WHATSAPP_WEB_TEABLE_SKIP_MESSAGES:-0}
      - EA_WHATSAPP_WEB_TEABLE_SKIP_PERSONAS=${EA_WHATSAPP_WEB_TEABLE_SKIP_PERSONAS:-0}
      - EA_WHATSAPP_WEB_TEABLE_SKIP_ROUTES=${EA_WHATSAPP_WEB_TEABLE_SKIP_ROUTES:-0}
      - EA_WHATSAPP_WEB_PRESERVE_SIDECAR_LIVE_ROUTES=${EA_WHATSAPP_WEB_PRESERVE_SIDECAR_LIVE_ROUTES:-1}
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/whatsapp-teable-sync
      - TEABLE_BASE_URL=${TEABLE_RUNTIME_BASE_URL:-https://app.teable.ai}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/ea
      - TZ=Europe/Vienna
    volumes:
      - ./:/app:ro
      - type: bind
        source: /dev/null
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: tmpfs
        target: /app/config
        tmpfs:
          size: 65536
          mode: 365
      - type: bind
        source: ./config/onemin_api_keys.example.json
        target: /app/config/onemin_api_keys.example.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_slot_owners.json
        target: /app/config/onemin_slot_owners.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/places.yml
        target: /app/config/places.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/tenants.yml
        target: /app/config/tenants.yml
        read_only: true
        bind:
          create_host_path: false
      - ea_whatsapp_web_teable_sync:/data/whatsapp-teable-sync
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${EA_WHATSAPP_WEB_TEABLE_SYNC_ENABLED:-0}" != "1" ]; then
          echo '{"enabled":false,"event":"whatsapp_web_teable_sync_idle","ok":true}';
          while :; do sleep 3600; done;
        fi
        while :; do
          code=0;
          timeout "$${EA_WHATSAPP_WEB_TEABLE_SYNC_RUN_TIMEOUT_SECONDS:-300}s" python /app/scripts/sync_whatsapp_web_session_to_teable.py || code="$$?";
          if [ "$${code}" -ne 0 ]; then
            echo "{\"event\":\"whatsapp_web_teable_sync_run_failed\",\"exit_code\":$${code},\"ok\":false}";
          fi
          sleep "$${EA_WHATSAPP_WEB_TEABLE_SYNC_INTERVAL_SECONDS:-30}";
        done
    depends_on:
      ea-whatsapp-web-session:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python /app/scripts/check_whatsapp_web_teable_sync_readiness.py
      interval: 2m
      timeout: 10s
      retries: 5

volumes:
  ea_whatsapp_web_session:
    name: ea_whatsapp_web_session
  ea_whatsapp_web_actions:
    name: ea_whatsapp_web_actions
  ea_whatsapp_web_teable_sync:
    name: ea_whatsapp_web_teable_sync
