services:
  ea-whatsapp-web-session:
    build:
      context: ./whatsapp-web-session
      dockerfile: Dockerfile
    image: ea-whatsapp-web-session:local
    container_name: ea-whatsapp-web-session
    restart: unless-stopped
    environment:
      - WA_WEB_SESSION_REF=${EA_WHATSAPP_WEB_DEFAULT_SESSION_REF:-default-wa-web}
      - WA_WEB_SESSION_LABEL=${EA_WHATSAPP_WEB_DEFAULT_SESSION_LABEL:-Executive Assistant WhatsApp Web Session}
      - WA_WEB_SESSION_PORT=8098
      - WA_WEB_SESSION_DATA_DIR=/data/session
      - WA_WEB_SESSION_API_TOKEN=${EA_WHATSAPP_WEB_SESSION_API_TOKEN:-}
      - WA_WEB_AUTOREPLY_ENABLED=${EA_WHATSAPP_WEB_AUTOREPLY_ENABLED:-0}
      - WA_WEB_AUTOREPLY_TEXT=${EA_WHATSAPP_WEB_AUTOREPLY_TEXT:-Na geh... ich bin die Herta. Schreib mir bitte kurz, ich bin beim Tippen langsam.}
      - WA_WEB_AUTOREPLY_ALLOWED_RECIPIENTS=${EA_WHATSAPP_WEB_AUTOREPLY_ALLOWED_RECIPIENTS:-}
      - WA_WEB_DEFAULT_HEYY_AI_KEY=${EA_WHATSAPP_WEB_DEFAULT_HEYY_AI_KEY:-empathetic_slow_typing_old_lady}
      - WA_WEB_DEFAULT_HEYY_AI_NAME=${EA_WHATSAPP_WEB_DEFAULT_HEYY_AI_NAME:-Herta (Heyy Lady)}
      - WA_WEB_HEYY_AI_ROUTE_MAP_JSON=${EA_WHATSAPP_WEB_HEYY_AI_ROUTE_MAP_JSON:-}
      - WA_WEB_HEYY_AI_TYPING_DELAY_MS=${EA_WHATSAPP_WEB_HEYY_AI_TYPING_DELAY_MS:-6500}
      - WA_WEB_HEYY_AI_MAX_TYPING_DELAY_MS=${EA_WHATSAPP_WEB_HEYY_AI_MAX_TYPING_DELAY_MS:-3600000}
      - WA_WEB_HEYY_AI_PRE_REPLY_DELAY_MIN_SECONDS=${EA_WHATSAPP_WEB_HEYY_AI_PRE_REPLY_DELAY_MIN_SECONDS:-180}
      - WA_WEB_HEYY_AI_PRE_REPLY_DELAY_MAX_SECONDS=${EA_WHATSAPP_WEB_HEYY_AI_PRE_REPLY_DELAY_MAX_SECONDS:-1800}
      - WA_WEB_HEYY_AI_QUIET_HOURS_START_HOUR=${EA_WHATSAPP_WEB_HEYY_AI_QUIET_HOURS_START_HOUR:-21}
      - WA_WEB_HEYY_AI_QUIET_HOURS_END_HOUR=${EA_WHATSAPP_WEB_HEYY_AI_QUIET_HOURS_END_HOUR:-6}
      - WA_WEB_HEYY_AI_TYPING_DELAY_MS_PER_CHARACTER=${EA_WHATSAPP_WEB_HEYY_AI_TYPING_DELAY_MS_PER_CHARACTER:-8000}
      - WA_WEB_HEYY_AI_TYPING_STATUS_ENABLED=${EA_WHATSAPP_WEB_HEYY_AI_TYPING_STATUS_ENABLED:-1}
      - WA_WEB_INBOX_LIMIT=${EA_WHATSAPP_WEB_INBOX_LIMIT:-100}
      - WA_WEB_JSON_LIMIT=${EA_WHATSAPP_WEB_JSON_LIMIT:-48mb}
      - WA_WEB_CONVERSATION_FETCH_TIMEOUT_MS=${EA_WHATSAPP_WEB_CONVERSATION_FETCH_TIMEOUT_MS:-15000}
      - WA_WEB_CONVERSATION_FETCH_CONCURRENCY=${EA_WHATSAPP_WEB_CONVERSATION_FETCH_CONCURRENCY:-6}
      - WA_WEB_STORE_MESSAGE_TEXT=${EA_WHATSAPP_WEB_STORE_MESSAGE_TEXT:-1}
      - WA_WEB_POLL_BUTTONS_ENABLED=${EA_WHATSAPP_WEB_POLL_BUTTONS_ENABLED:-1}
      - WA_WEB_NATIVE_BUTTONS_ENABLED=${EA_WHATSAPP_WEB_NATIVE_BUTTONS_ENABLED:-0}
      - TZ=Europe/Vienna
    ports:
      - "127.0.0.1:${EA_WHATSAPP_WEB_SESSION_HOST_PORT:-8098}:8098"
    cpu_shares: ${EA_WHATSAPP_WEB_SESSION_CPU_SHARES:-128}
    cpus: ${EA_WHATSAPP_WEB_SESSION_CPUS:-1.5}
    volumes:
      - ea_whatsapp_web_session:/data/session
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8098/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5

  ea-whatsapp-web-activator:
    image: ea-runtime:latest
    container_name: ea-whatsapp-web-activator
    restart: unless-stopped
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
    working_dir: /app
    cpu_shares: ${EA_WHATSAPP_WEB_ACTIVATOR_CPU_SHARES:-32}
    cpus: ${EA_WHATSAPP_WEB_ACTIVATOR_CPUS:-0.25}
    environment:
      - EA_WHATSAPP_WEB_ACTIVATOR_ENABLED=${EA_WHATSAPP_WEB_ACTIVATOR_ENABLED:-0}
      - VOCALLAB_API_KEY=
      - VOCALLAB_API_KEY_FILE=
      - EA_WHATSAPP_WEB_DEFAULT_BINDING_ID=${EA_WHATSAPP_WEB_DEFAULT_BINDING_ID:-ea-whatsapp-web-session}
      - EA_WHATSAPP_WEB_DEFAULT_BROWSER_PROFILE_REF=${EA_WHATSAPP_WEB_DEFAULT_BROWSER_PROFILE_REF:-docker-volume://ea_whatsapp_web_session}
      - EA_WHATSAPP_WEB_DEFAULT_PRINCIPAL_ID=${EA_WHATSAPP_WEB_DEFAULT_PRINCIPAL_ID:-principal-default}
      - EA_WHATSAPP_WEB_DEFAULT_SESSION_LABEL=${EA_WHATSAPP_WEB_DEFAULT_SESSION_LABEL:-Executive Assistant WhatsApp Web Session}
      - EA_WHATSAPP_WEB_DEFAULT_SESSION_REF=${EA_WHATSAPP_WEB_DEFAULT_SESSION_REF:-default-wa-web}
      - EA_WHATSAPP_WEB_ACTIVATION_WATCH_INTERVAL_SECONDS=${EA_WHATSAPP_WEB_ACTIVATION_WATCH_INTERVAL_SECONDS:-5}
      - EA_WHATSAPP_WEB_ACTIVATION_WATCH_MAX_SECONDS=${EA_WHATSAPP_WEB_ACTIVATION_WATCH_MAX_SECONDS:-0}
      - EA_WHATSAPP_WEB_ACTIVATION_SEND_TEST=${EA_WHATSAPP_WEB_ACTIVATION_SEND_TEST:-0}
      - EA_WHATSAPP_WEB_LIVE_TEST_RECIPIENT=${EA_WHATSAPP_WEB_LIVE_TEST_RECIPIENT:-}
      - EA_WHATSAPP_WEB_LIVE_TEST_TEXT=${EA_WHATSAPP_WEB_LIVE_TEST_TEXT:-EA WhatsApp Web live delivery test}
      - EA_WHATSAPP_WEB_SESSION_API_BASE_URL=${EA_WHATSAPP_WEB_SESSION_API_BASE_URL:-http://ea-whatsapp-web-session:8098}
      - EA_WHATSAPP_WEB_SESSION_API_TOKEN=${EA_WHATSAPP_WEB_SESSION_API_TOKEN:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@ea-db:5432/ea}
      - PYTHONPATH=/app/ea
      - TZ=Europe/Vienna
    volumes:
      - ./:/app:ro
      - type: bind
        source: /dev/null
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: tmpfs
        target: /app/config
        tmpfs:
          size: 65536
          mode: 365
      - type: bind
        source: ./config/onemin_api_keys.example.json
        target: /app/config/onemin_api_keys.example.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_slot_owners.json
        target: /app/config/onemin_slot_owners.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/places.yml
        target: /app/config/places.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/tenants.yml
        target: /app/config/tenants.yml
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$${EA_WHATSAPP_WEB_ACTIVATOR_ENABLED:-0}" != "1" ]; then
          echo '{"enabled":false,"event":"whatsapp_web_session_activator_idle","ok":true}';
          while :; do sleep 3600; done;
        fi
        python /app/scripts/watch_whatsapp_web_session_activation.py
        echo '{"event":"whatsapp_web_session_activator_complete","ok":true}';
        while :; do sleep 3600; done
    depends_on:
      ea-whatsapp-web-session:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import pathlib; p=pathlib.Path('/app/scripts/watch_whatsapp_web_session_activation.py'); raise SystemExit(0 if p.exists() else 1)"
      interval: 2m
      timeout: 10s
      retries: 5

  ea-whatsapp-web-action-processor:
    image: ea-runtime:latest
    container_name: ea-whatsapp-web-action-processor
    restart: unless-stopped
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
    working_dir: /app
    cpu_shares: ${EA_WHATSAPP_WEB_ACTION_PROCESSOR_CPU_SHARES:-32}
    cpus: ${EA_WHATSAPP_WEB_ACTION_PROCESSOR_CPUS:-0.50}
    environment:
      - EA_WHATSAPP_WEB_ACTION_PROCESSOR_ENABLED=${EA_WHATSAPP_WEB_ACTION_PROCESSOR_ENABLED:-1}
      - EA_WHATSAPP_WEB_ACTION_POLL_INTERVAL_SECONDS=${EA_WHATSAPP_WEB_ACTION_POLL_INTERVAL_SECONDS:-30}
