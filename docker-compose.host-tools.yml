services:
  ea-docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    # Upstream writes its rendered HAProxy config beside the image template.
    # Keep the rootfs read-only and render the same config into ephemeral /run.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        disable_ipv6_lower="$$(printf '%s' "$${DISABLE_IPV6:-}" | tr '[:upper:]' '[:lower:]')"
        case "$${disable_ipv6_lower}" in
          1|true|yes) bind_config=':2375' ;;
          *) bind_config='[::]:2375 v4v6' ;;
        esac
        sed 's/$${BIND_CONFIG}/'"$${bind_config}"'/g' \
          /usr/local/etc/haproxy/haproxy.cfg.template > /run/haproxy.cfg
        exec haproxy -W -db -f /run/haproxy.cfg
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - INFO=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run

  ea-api:
    build:
      context: .
      dockerfile: ea/Dockerfile.operator
    image: ea-runtime-operator:latest
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    environment:
      - EA_CREZLO_SHARED_TEMP_ROOT=${EA_CREZLO_SHARED_TEMP_ROOT:-.runtime/browseract_bootstrap/runtime/crezlo_worker_shared}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    volumes:
      - /docker:/docker:ro

  ea-worker:
    build:
      context: .
      dockerfile: ea/Dockerfile.operator
    image: ea-runtime-operator:latest
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    environment:
      - EA_CREZLO_SHARED_TEMP_ROOT=${EA_CREZLO_SHARED_TEMP_ROOT:-.runtime/browseract_bootstrap/runtime/crezlo_worker_shared}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    volumes:
      - /docker:/docker:ro

  ea-scheduler:
    build:
      context: .
      dockerfile: ea/Dockerfile.operator
    image: ea-runtime-operator:latest
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    environment:
      - EA_CREZLO_SHARED_TEMP_ROOT=${EA_CREZLO_SHARED_TEMP_ROOT:-.runtime/browseract_bootstrap/runtime/crezlo_worker_shared}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    volumes:
      - /docker:/docker:ro
