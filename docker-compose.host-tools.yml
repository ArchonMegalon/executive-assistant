services:
  ea-docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - INFO=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run

  ea-api:
    build:
      context: .
      dockerfile: ea/Dockerfile.operator
    image: ea-runtime-operator:latest
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    environment:
      - EA_CREZLO_SHARED_TEMP_ROOT=${EA_CREZLO_SHARED_TEMP_ROOT:-.runtime/browseract_bootstrap/runtime/crezlo_worker_shared}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    volumes:
      - /docker:/docker:ro

  ea-worker:
    build:
      context: .
      dockerfile: ea/Dockerfile.operator
    image: ea-runtime-operator:latest
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    environment:
      - EA_CREZLO_SHARED_TEMP_ROOT=${EA_CREZLO_SHARED_TEMP_ROOT:-.runtime/browseract_bootstrap/runtime/crezlo_worker_shared}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    volumes:
      - /docker:/docker:ro

  ea-scheduler:
    build:
      context: .
      dockerfile: ea/Dockerfile.operator
    image: ea-runtime-operator:latest
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    environment:
      - EA_CREZLO_SHARED_TEMP_ROOT=${EA_CREZLO_SHARED_TEMP_ROOT:-.runtime/browseract_bootstrap/runtime/crezlo_worker_shared}
      - DOCKER_HOST=tcp://ea-docker-socket-proxy:2375
    volumes:
      - /docker:/docker:ro
