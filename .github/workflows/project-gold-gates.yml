name: Project and Gold Gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/project-gold-gates.yml"
      - ".codex-design/**"
      - ".codex-studio/**"
      - "Makefile"
      - "ea/app/**"
      - "ea/scripts/**"
      - "scripts/materialize_project_mode_manifests.py"
      - "scripts/materialize_whole_project_gold_map.py"
      - "scripts/verify_project_mode_manifests.py"
      - "scripts/verify_whole_project_gold_map.py"
      - "tests/test_project_mode_*.py"
      - "tests/test_memorial_gold_readiness.py"
      - "tests/test_measure_memorial_live_browser.py"
      - "tests/test_validate_memorial_voice_loop.py"
      - "tests/test_memorial_voice_stability_gate.py"
      - "tests/test_memorial_live_conversation_contracts.py"

concurrency:
  group: project-gold-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ea/requirements.txt
      - name: Project mode and memorial contract tests
        run: |
          PYTHONPATH=.:ea pytest -q \
            tests/test_project_mode_manifests.py \
            tests/test_project_mode_surfaces.py \
            tests/test_memorial_gold_readiness.py \
            tests/test_measure_memorial_live_browser.py \
            tests/test_validate_memorial_voice_loop.py \
            tests/test_memorial_voice_stability_gate.py \
            tests/test_memorial_live_conversation_contracts.py::test_memorial_chat_current_weather_ignores_present_world_search_even_when_enabled \
            tests/test_memorial_live_conversation_contracts.py::test_memorial_present_world_search_request_is_disabled_for_local_source_policy \
            tests/test_memorial_security_contracts.py::test_memorial_live_page_stays_voice_only_without_legacy_video_call_ui
      - name: Static release verifiers
        run: |
          PYTHONPATH=ea python scripts/verify_project_mode_manifests.py
          PYTHONPATH=ea python scripts/verify_whole_project_gold_map.py
