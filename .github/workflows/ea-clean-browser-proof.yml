name: EA Clean Browser Proof

on:
  push:
    branches:
      - main
      - codex/audiobook-source-to-performance-20260719
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ea-clean-browser-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-proof:
    name: Clean source and real browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ea/requirements.txt

      - name: Install pinned runtime and proof dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            pytest==9.0.2 \
            -r ea/requirements.txt

      - name: Install the pinned Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Materialize the clean browser workflow proof
        run: |
          mkdir -p proof
          python scripts/materialize_ea_browser_workflow_proof.py \
            --output proof/EA_BROWSER_WORKFLOW_PROOF.generated.json

      - name: Verify the receipt is green and bound to this revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path("proof/EA_BROWSER_WORKFLOW_PROOF.generated.json").read_text(
                  encoding="utf-8"
              )
          )
          assert receipt["status"] == "pass", receipt.get("blocking_reasons")
          assert receipt["source_revision"] == os.environ["EXPECTED_REVISION"]
          assert receipt["source_worktree_dirty"] is False
          assert receipt["source_backed_journey_proof"]["status"] == "pass"
          assert receipt["real_browser_e2e_proof"]["status"] == "pass"
          PY

      - name: Upload the revision-bound proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ea-browser-workflow-proof-${{ github.run_id }}
          path: proof/EA_BROWSER_WORKFLOW_PROOF.generated.json
          if-no-files-found: error
          retention-days: 14
