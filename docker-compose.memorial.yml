services:
  ea-api:
    image: ${EA_MEMORIAL_IMAGE:?set an immutable revision-bound EA_MEMORIAL_IMAGE}
    pull_policy: never
    environment:
      - EA_SOURCE_REVISION=${EA_SOURCE_REVISION:?set EA_SOURCE_REVISION for memorial deployments}
      - EA_ENABLE_PUBLIC_MEMORIALS=${EA_ENABLE_PUBLIC_MEMORIALS:-1}
      - EA_HEALTHCHECK_MEMORIAL_SLUG=${EA_HEALTHCHECK_MEMORIAL_SLUG:-manfred}
      - EA_PUBLIC_MEMORIAL_RATE_BACKEND=${EA_PUBLIC_MEMORIAL_RATE_BACKEND:-redis}
      - EA_PUBLIC_MEMORIAL_REDIS_URL=${EA_PUBLIC_MEMORIAL_REDIS_URL:-redis://ea-redis:6379/0}
      - EA_PUBLIC_MEMORIAL_DIR=${EA_PUBLIC_MEMORIAL_DIR:-/data/memorial_data/public_memorials}
      - EA_PRIVATE_MEMORIAL_PROFILE_DIR=${EA_PRIVATE_MEMORIAL_PROFILE_DIR:-/data/memorial_data/private_memorial_profiles}
      - EA_PUBLIC_MEMORIAL_CONTRIBUTION_DIR=/data/memorial-writable/public-contributions
      - EA_PRIVATE_MEMORIAL_CONTRIBUTION_DIR=/data/memorial-writable/private-contributions
      - EA_MEMORIAL_STATE_DIR=/data/memorial-writable/state
      - EA_MEMORIAL_LIVE_TTS_PLUGIN=${EA_MEMORIAL_LIVE_TTS_PLUGIN:-unmixr_clone}
      - EA_TRUST_API_TOKEN_PRINCIPAL_HEADER=0
      - EA_TRUST_PROXY_HEADERS=1
      - EA_TRUSTED_PROXY_CIDRS=${EA_MEMORIAL_TRUSTED_PROXY_CIDRS:?set the exact trusted memorial proxy CIDR}
      - EA_TRUSTED_PUBLIC_ORIGIN_ALIASES=${EA_MEMORIAL_TRUSTED_PUBLIC_ORIGIN_ALIASES:-origin.myexternalbrain.com}
      - EA_ALLOWED_PUBLIC_HOSTS=${EA_MEMORIAL_ALLOWED_PUBLIC_HOSTS:-myexternalbrain.com,www.myexternalbrain.com}
    volumes:
      - ${EA_MEMORIAL_DATA_HOST_PATH:-./memorial_data}:/data/memorial_data:ro
      - ${EA_MEMORIAL_RUNTIME_HOST_PATH:?set the validated Manfred runtime root}/public-contributions:/data/memorial-writable/public-contributions
      - ${EA_MEMORIAL_RUNTIME_HOST_PATH:?set the validated Manfred runtime root}/private-contributions:/data/memorial-writable/private-contributions
      - ${EA_MEMORIAL_RUNTIME_HOST_PATH:?set the validated Manfred runtime root}/state:/data/memorial-writable/state
