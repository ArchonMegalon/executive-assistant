      - EA_AUDIOBOOKSHELF_AUTO_IMPORT=${EA_AUDIOBOOKSHELF_AUTO_IMPORT:-1}
      - EA_AUDIOBOOKSHELF_IMPORT_ROOT=${EA_AUDIOBOOKSHELF_IMPORT_ROOT:-/data/audiobooks/audiobookshelf}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_ENABLED=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_ENABLED:-1}
      - EA_AUDIOBOOKSHELF_API_BASE_URL=${EA_AUDIOBOOKSHELF_API_BASE_URL:-}
      - EA_AUDIOBOOKSHELF_PUBLIC_BASE_URL=${EA_AUDIOBOOKSHELF_PUBLIC_BASE_URL:-}
      - EA_AUDIOBOOKSHELF_API_TOKEN=${EA_AUDIOBOOKSHELF_API_TOKEN:-}
      - EA_AUDIOBOOKSHELF_LIBRARY_ID=${EA_AUDIOBOOKSHELF_LIBRARY_ID:-}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_EXPIRES_DAYS=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_EXPIRES_DAYS:-30}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_DOWNLOADABLE=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_DOWNLOADABLE:-0}
      - EA_AUDIOBOOK_ACCESS_SIGNING_SECRET=${EA_SIGNING_SECRET:-}
      - EA_AUDIOBOOK_ACCESS_EXPIRES_DAYS=${EA_AUDIOBOOK_ACCESS_EXPIRES_DAYS:-30}
      - EA_AUDIOBOOK_PLAYER_ACCESS_BASE_URL=${EA_AUDIOBOOK_PLAYER_ACCESS_BASE_URL:-}
      - EA_SCHEDULER_AUDIOBOOK_RESUME_ENABLED=${EA_SCHEDULER_AUDIOBOOK_RESUME_ENABLED:-1}
      - EA_SCHEDULER_AUDIOBOOK_RESUME_INTERVAL_SECONDS=${EA_SCHEDULER_AUDIOBOOK_RESUME_INTERVAL_SECONDS:-300}
      - EA_AUDIOBOOK_RESUME_DUE_LIMIT=${EA_AUDIOBOOK_RESUME_DUE_LIMIT:-2}
      - EA_AUDIOBOOK_RESUME_ATTEMPT_COOLDOWN_SECONDS=${EA_AUDIOBOOK_RESUME_ATTEMPT_COOLDOWN_SECONDS:-900}
      - HOME=/home/ea
      - TEABLE_BASE_URL=${TEABLE_RUNTIME_BASE_URL:-https://app.teable.ai}
      - TEABLE_TABLE_SYNC_CONFIG_JSON=${TEABLE_TABLE_SYNC_CONFIG_JSON:-}
      - TZ=Europe/Vienna
    volumes:
      - ./config:/config:ro
      - ./config:/app/config:ro
      - ./ea/app/services/audiobook_epub_pipeline.py:/app/app/services/audiobook_epub_pipeline.py:ro
      - ./ea/app/services/whatsapp_delivery_outbox.py:/app/app/services/whatsapp_delivery_outbox.py:ro
      - ./ea/app/services/whatsapp_delivery_router.py:/app/app/services/whatsapp_delivery_router.py:ro
      - ./ea/app/services/whatsapp_inbound_actions.py:/app/app/services/whatsapp_inbound_actions.py:ro
      - ./ea/app/services/whatsapp_web_session_delivery.py:/app/app/services/whatsapp_web_session_delivery.py:ro
      - ./ea/app/services/whatsapp_web_session_readiness.py:/app/app/services/whatsapp_web_session_readiness.py:ro
      - ${EA_ONEDRIVE_ATTACHMENTS_HOST_PATH:-./data/onedrive_attachments}:/data/onedrive_attachments
      - ${EA_DURABLE_AUDIOBOOK_HOST_ROOT:-./data/audiobooks}:/data/audiobooks
      - ea_artifacts:/data/artifacts
      - ea_provider_ledger:/data/provider-ledger
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ea-teable-relay:
        condition: service_healthy
      ea-db:
        condition: service_healthy
    healthcheck:
      disable: true

  ea-proactive-ooda:
    image: ea-runtime:latest
    container_name: ea-proactive-ooda
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    environment:
      - EA_PROACTIVE_OODA_ENABLED=${EA_PROACTIVE_OODA_ENABLED:-0}
      - EA_PROACTIVE_OODA_INTERVAL_SECONDS=${EA_PROACTIVE_OODA_INTERVAL_SECONDS:-900}
      - EA_PROACTIVE_OODA_STATE_PATH=${EA_PROACTIVE_OODA_CONTAINER_STATE_PATH:-/data/provider-ledger/proactive_ooda_notified.json}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@ea-db:5432/ea}
      - PYTHONPATH=/app/ea
      - TZ=Europe/Vienna
    volumes:
      - ./:/app:ro
      - ea_proactive_ooda_state:/data
    command:
      - /bin/sh
      - -ec
      - |
        while :; do
          if [ "$${EA_PROACTIVE_OODA_ENABLED:-0}" = "1" ]; then
            python /app/scripts/run_proactive_ooda.py || true
          fi
          sleep "$${EA_PROACTIVE_OODA_INTERVAL_SECONDS:-900}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import pathlib; p=pathlib.Path('/app/scripts/run_proactive_ooda.py'); raise SystemExit(0 if p.exists() else 1)"
      interval: 2m
      timeout: 10s
      retries: 5
    depends_on:
      ea-db:
        condition: service_healthy

  ea-telegram-teable-sync:
    image: ea-runtime:latest
    container_name: ea-telegram-teable-sync
    restart: unless-stopped
    env_file:
      - .env
    working_dir: /app
    environment:
      - EA_TELEGRAM_TEABLE_SYNC_ENABLED=${EA_TELEGRAM_TEABLE_SYNC_ENABLED:-0}
      - EA_TELEGRAM_TEABLE_SYNC_INTERVAL_SECONDS=${EA_TELEGRAM_TEABLE_SYNC_INTERVAL_SECONDS:-60}
      - EA_TELEGRAM_TEABLE_SYNC_BATCH_SIZE=${EA_TELEGRAM_TEABLE_SYNC_BATCH_SIZE:-500}
      - EA_TELEGRAM_TEABLE_BASE_ID=${EA_TELEGRAM_TEABLE_BASE_ID:-}
      - EA_TELEGRAM_MESSAGES_TEABLE_TABLE_ID=${EA_TELEGRAM_MESSAGES_TEABLE_TABLE_ID:-}
      - EA_TELEGRAM_MESSAGES_TEABLE_TABLE_NAME=${EA_TELEGRAM_MESSAGES_TEABLE_TABLE_NAME:-ea_telegram_conversation_messages}
      - EA_TELEGRAM_TEABLE_SYNC_STATE_FILE=${EA_TELEGRAM_TEABLE_SYNC_STATE_FILE:-/data/telegram-teable-sync/state.json}
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/telegram-teable-sync
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@ea-db:5432/ea}
      - TEABLE_BASE_URL=${TEABLE_RUNTIME_BASE_URL:-https://app.teable.ai}
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Vienna
    volumes:
      - ./:/app:ro
      - ea_telegram_teable_sync:/data/telegram-teable-sync
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -ec
      - |
        while :; do
          if [ "$${EA_TELEGRAM_TEABLE_SYNC_ENABLED:-0}" = "1" ]; then
            python /app/scripts/sync_telegram_conversations_to_teable.py || true
          else
            echo '{"enabled":false,"event":"telegram_teable_sync_idle","ok":true}';
          fi
          sleep "$${EA_TELEGRAM_TEABLE_SYNC_INTERVAL_SECONDS:-60}";
        done
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import pathlib; p=pathlib.Path('/app/scripts/sync_telegram_conversations_to_teable.py'); raise SystemExit(0 if p.exists() else 1)"
      interval: 2m
      timeout: 10s
      retries: 5
    depends_on:
      ea-teable-relay:
        condition: service_healthy
      ea-db:
        condition: service_healthy

  ea-db:
    image: postgres:16-alpine
    container_name: ea-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 3

  ea-redis:
    image: redis:7-alpine
    container_name: ea-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ea_artifacts: {}
  ea_openvoice_data: {}
  ea_pgdata: {}
  ea_proactive_ooda_state: {}
  ea_telegram_teable_sync: {}
  ea_public_tours:
    external: true
    name: property_propertyquarry_public_tours
  ea_provider_ledger: {}
