      - ${EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT:-./data/audiobooks/audiobookshelf}:/data/audiobooks/audiobookshelf
      - ea_artifacts:/data/artifacts
      - ea_provider_ledger:/data/provider-ledger
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ea-teable-relay:
        condition: service_healthy
      ea-db:
        condition: service_healthy
  ea-proactive-ooda:
    image: ea-runtime:latest
    container_name: ea-proactive-ooda
    entrypoint: ["/bin/sh", "-ec", "umask 0007; exec /usr/local/bin/docker-entrypoint.sh \"$@\"", "--"]
    group_add: ["1000"]
    restart: unless-stopped
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
    mem_limit: 512m
    mem_reservation: 128m
    cpu_shares: ${EA_PROACTIVE_OODA_CPU_SHARES:-64}
    cpus: ${EA_PROACTIVE_OODA_CPUS:-0.75}
    working_dir: /app
    environment:
      - EA_PROACTIVE_OODA_ENABLED=${EA_PROACTIVE_OODA_ENABLED:-0}
      - VOCALLAB_API_KEY=
      - VOCALLAB_API_KEY_FILE=
      - EA_PROACTIVE_OODA_ARMED_SEND=${EA_PROACTIVE_OODA_CONTAINER_ARMED_SEND:-1}
      - EA_PROACTIVE_OODA_INTERVAL_SECONDS=${EA_PROACTIVE_OODA_INTERVAL_SECONDS:-900}
      - EA_PROACTIVE_OODA_STATE_PATH=${EA_PROACTIVE_OODA_CONTAINER_STATE_PATH:-/data/provider-ledger/proactive_ooda_notified.json}
      - EA_PROACTIVE_OODA_RECEIPT_PATH=${EA_PROACTIVE_OODA_CONTAINER_RECEIPT_PATH:-/data/provider-ledger/proactive_ooda_latest_run.generated.json}
      - EA_OUTBOUND_EMAIL_GUARD_STATE_PATH=${EA_OUTBOUND_EMAIL_GUARD_STATE_PATH:-/data/provider-ledger/outbound_email_guard.json}
      - EA_EMAILIT_MAX_429_RETRY_ATTEMPTS=${EA_EMAILIT_MAX_429_RETRY_ATTEMPTS:-0}
      - EA_PROACTIVE_OODA_TEABLE_SYNC_ENABLED=${EA_PROACTIVE_OODA_TEABLE_SYNC_ENABLED:-0}
      - EA_POCKET_AUDIO_ARCHIVE_ROOT=${EA_POCKET_AUDIO_ARCHIVE_ROOT:-/data/pocket-ai-audio}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@ea-db:5432/ea}
      - PYTHONPATH=/app/ea
      - TZ=Europe/Vienna
    volumes:
      - ./:/app:ro
      - type: bind
        source: /dev/null
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: tmpfs
        target: /app/config
        tmpfs:
          size: 65536
          mode: 365
      - type: bind
        source: ./config/onemin_api_keys.example.json
        target: /app/config/onemin_api_keys.example.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_slot_owners.json
        target: /app/config/onemin_slot_owners.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/places.yml
        target: /app/config/places.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/tenants.yml
        target: /app/config/tenants.yml
        read_only: true
        bind:
          create_host_path: false
      - ./.codex-studio/published:/app/.codex-studio/published
      - ./.runtime:/app/.runtime
      - ${EA_POCKET_AUDIO_ARCHIVE_HOST_ROOT:-./data/pocket-ai-audio}:/data/pocket-ai-audio
      - ea_provider_ledger:/data/provider-ledger
      - type: tmpfs
        target: /data/provider-ledger/vocallab
        tmpfs:
          size: 65536
          mode: 365
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    command:
      - /bin/sh
      - -ec
      - |
        failures=0
        while :; do
          if [ "$${EA_PROACTIVE_OODA_ENABLED:-0}" = "1" ]; then
            if python /app/scripts/run_proactive_ooda.py; then
              failures=0
            else
              failures=$$((failures + 1))
              if [ "$${failures}" -ge 3 ]; then
                echo "proactive OODA failed three consecutive runs; exiting for supervised restart" >&2
                exit 1
              fi
            fi
          fi
          sleep "$${EA_PROACTIVE_OODA_INTERVAL_SECONDS:-900}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if [ "$${EA_PROACTIVE_OODA_ENABLED:-0}" = "1" ]; then
            python /app/scripts/verify_proactive_ooda_live_receipt.py;
          else
            python -c "import pathlib; p=pathlib.Path('/app/scripts/run_proactive_ooda.py'); raise SystemExit(0 if p.exists() else 1)";
          fi
      interval: 2m
      start_period: 2m
      timeout: 10s
      retries: 5
    depends_on:
      ea-db:
        condition: service_healthy

  ea-telegram-teable-sync:
    image: ea-runtime:latest
    container_name: ea-telegram-teable-sync
    restart: unless-stopped
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
    mem_limit: 512m
    mem_reservation: 128m
    working_dir: /app
    environment:
      - EA_TELEGRAM_TEABLE_SYNC_ENABLED=${EA_TELEGRAM_TEABLE_SYNC_ENABLED:-0}
      - VOCALLAB_API_KEY=
      - VOCALLAB_API_KEY_FILE=
      - EA_TELEGRAM_TEABLE_SYNC_INTERVAL_SECONDS=${EA_TELEGRAM_TEABLE_SYNC_INTERVAL_SECONDS:-60}
      - EA_TELEGRAM_TEABLE_SYNC_BATCH_SIZE=${EA_TELEGRAM_TEABLE_SYNC_BATCH_SIZE:-500}
      - EA_TELEGRAM_TEABLE_BASE_ID=${EA_TELEGRAM_TEABLE_BASE_ID:-}
      - EA_TELEGRAM_MESSAGES_TEABLE_TABLE_ID=${EA_TELEGRAM_MESSAGES_TEABLE_TABLE_ID:-}
      - EA_TELEGRAM_MESSAGES_TEABLE_TABLE_NAME=${EA_TELEGRAM_MESSAGES_TEABLE_TABLE_NAME:-ea_telegram_conversation_messages}
      - EA_TELEGRAM_TEABLE_SYNC_STATE_FILE=${EA_TELEGRAM_TEABLE_SYNC_STATE_FILE:-/data/telegram-teable-sync/state.json}
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/telegram-teable-sync
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-}@ea-db:5432/ea}
      - TEABLE_BASE_URL=${TEABLE_RUNTIME_BASE_URL:-https://app.teable.ai}
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Vienna
    volumes:
      - ./:/app:ro
      - type: bind
        source: /dev/null
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: tmpfs
        target: /app/config
        tmpfs:
          size: 65536
          mode: 365
      - type: bind
        source: ./config/onemin_api_keys.example.json
        target: /app/config/onemin_api_keys.example.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_slot_owners.json
        target: /app/config/onemin_slot_owners.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/places.yml
        target: /app/config/places.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/tenants.yml
        target: /app/config/tenants.yml
        read_only: true
        bind:
          create_host_path: false
      - ea_telegram_teable_sync:/data/telegram-teable-sync
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -ec
      - |
        while :; do
          if [ "$${EA_TELEGRAM_TEABLE_SYNC_ENABLED:-0}" = "1" ]; then
            python /app/scripts/sync_telegram_conversations_to_teable.py || true
          else
            echo '{"enabled":false,"event":"telegram_teable_sync_idle","ok":true}';
          fi
          sleep "$${EA_TELEGRAM_TEABLE_SYNC_INTERVAL_SECONDS:-60}";
        done
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import pathlib; p=pathlib.Path('/app/scripts/sync_telegram_conversations_to_teable.py'); raise SystemExit(0 if p.exists() else 1)"
      interval: 2m
      timeout: 10s
      retries: 5
    depends_on:
      ea-teable-relay:
        condition: service_healthy
      ea-db:
        condition: service_healthy

  ea-db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: ea-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ea}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    mem_limit: 2g
    mem_reservation: 512m
    volumes:
      - ea_pgdata:/var/lib/postgresql/data
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 3

  ea-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: ea-redis
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ea_artifacts: {}
  ea_pgdata: {}
  ea_telegram_teable_sync: {}
  ea_public_tours:
    external: true
    name: ea_myexternalbrain_public_tours
  ea_provider_ledger: {}
  ea_whatsapp_web_actions:
    name: ea_whatsapp_web_actions

networks:
  public_ingress:
    name: ${EA_PUBLIC_INGRESS_NETWORK_NAME:-ea_public_ingress}
    ipam:
      config:
        - subnet: ${EA_PUBLIC_INGRESS_SUBNET:-172.31.254.0/29}
          gateway: ${EA_PUBLIC_INGRESS_GATEWAY:-172.31.254.1}
