services:
  ea-teable-relay:
    build:
      context: .
      dockerfile: ea/Dockerfile
    image: ea-teable-relay:latest
    container_name: ea-teable-relay
    restart: unless-stopped
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      - TEABLE_RELAY_LISTEN_HOST=${TEABLE_RELAY_LISTEN_HOST:-172.17.0.1}
      - VOCALLAB_API_KEY=
      - VOCALLAB_API_KEY_FILE=
      - TZ=Europe/Vienna
    network_mode: host
    command:
      - python3
      - /app/scripts/teable_host_proxy.py
      - --listen-host
      - ${TEABLE_RELAY_LISTEN_HOST:-172.17.0.1}
      - --listen-port
      - "18787"
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --connect-timeout 2 --max-time 10 http://${TEABLE_RELAY_LISTEN_HOST:-172.17.0.1}:18787/healthz >/dev/null
      interval: 2m
      timeout: 10s
      retries: 5

  ea-api:
    build:
      context: .
      dockerfile: ea/Dockerfile
    image: ea-runtime:latest
    container_name: ea-api
    entrypoint: ["/bin/sh", "-ec", "umask 0007; exec /usr/local/bin/docker-entrypoint.sh \"$@\"", "--"]
    command: ["python", "-m", "app.runner"]
    group_add: ["1000"]
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    cpu_shares: ${EA_API_CPU_SHARES:-512}
    cpus: ${EA_API_CPUS:-2.0}
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
      - path: .ea-runtime-secrets/ea_runtime.local.env
        required: false
    environment:
      - EA_ROLE=api
      - EA_PORT=8090
      - EA_ASSISTANT_OWNER_LABEL=${EA_ASSISTANT_OWNER_LABEL:-the principal}
      - EA_API_TOKEN=${EA_API_TOKEN:-}
      - EA_TRUST_API_TOKEN_PRINCIPAL_HEADER=${EA_TRUST_API_TOKEN_PRINCIPAL_HEADER:-0}
      - EA_ALLOW_LOOPBACK_NO_AUTH=${EA_ALLOW_LOOPBACK_NO_AUTH:-0}
      # CodexEA's authenticated /v1/responses, status and profile contract.
      # Bind the shared token to a server-configured identity; never accept the
      # caller's X-EA-Principal-ID as the identity source in production.
      - EA_CODEXEA_AUTHENTICATED_PRINCIPAL_ID=${EA_DEFAULT_PRINCIPAL_ID:-}
      - EA_ENABLE_LEGACY_RUNTIME_SURFACES=${EA_ENABLE_LEGACY_RUNTIME_SURFACES:-1}
      - EA_ARTIFACTS_DIR=/data/artifacts
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/provider-ledger
      - EA_OUTBOUND_EMAIL_GUARD_STATE_PATH=${EA_OUTBOUND_EMAIL_GUARD_STATE_PATH:-/data/provider-ledger/outbound_email_guard.json}
      - EA_EMAILIT_MAX_429_RETRY_ATTEMPTS=${EA_EMAILIT_MAX_429_RETRY_ATTEMPTS:-0}
      - EA_SCHEDULER_TELEGRAM_ASYNC_IDLE_INTERVAL_SECONDS=${EA_SCHEDULER_TELEGRAM_ASYNC_IDLE_INTERVAL_SECONDS:-30}
      - EA_SCHEDULER_WHATSAPP_ASYNC_IDLE_INTERVAL_SECONDS=${EA_SCHEDULER_WHATSAPP_ASYNC_IDLE_INTERVAL_SECONDS:-30}
      - EA_SCHEDULER_ASYNC_IDLE_LOG_INTERVAL_SECONDS=${EA_SCHEDULER_ASYNC_IDLE_LOG_INTERVAL_SECONDS:-300}
      - EA_ONEDRIVE_ATTACHMENT_ROOT=/data/onedrive_attachments
      - EA_POCKET_AUDIO_ARCHIVE_ROOT=${EA_POCKET_AUDIO_ARCHIVE_ROOT:-/data/pocket-ai-audio}
      - EA_ANSWERLY_AUTO_IMPORT_GMAIL_PDFS=${EA_ANSWERLY_AUTO_IMPORT_GMAIL_PDFS:-1}
      - EA_TELEGRAM_AUDIOBOOK_EPUB_ENABLED=${EA_TELEGRAM_AUDIOBOOK_EPUB_ENABLED:-1}
      - EA_AUDIOBOOK_DURABLE_STORAGE_ROOT=${EA_AUDIOBOOK_DURABLE_STORAGE_ROOT:-/data/audiobooks}
      - EA_AUDIOBOOK_JOBS_ROOT=${EA_AUDIOBOOK_JOBS_ROOT:-/data/audiobooks/jobs}
      - EA_AUDIOBOOK_CANARY_RECEIPT_HMAC_KEY=${EA_AUDIOBOOK_CANARY_RECEIPT_HMAC_KEY:-}
      - EA_AUDIOBOOK_EXTERNAL_TTS_ENABLED=${EA_AUDIOBOOK_EXTERNAL_TTS_ENABLED:-1}
      - EA_AUDIOBOOK_UNMIXR_AUTO_RENDER=${EA_AUDIOBOOK_UNMIXR_AUTO_RENDER:-1}
      - EA_AUDIOBOOK_UNMIXR_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_UNMIXR_MAX_CHARS_PER_REQUEST:-1800}
      - VOCALLAB_API_KEY=${VOCALLAB_API_KEY:-}
      - VOCALLAB_API_KEY_FILE=${VOCALLAB_API_KEY_FILE:-config/vocallab_api_key}
      - EA_AUDIOBOOK_VOCALLAB_ENABLED=${EA_AUDIOBOOK_VOCALLAB_ENABLED:-0}
      - EA_AUDIOBOOK_VOCALLAB_AUTO_RENDER=${EA_AUDIOBOOK_VOCALLAB_AUTO_RENDER:-0}
      - EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_ROTATION_REQUIRED=${EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_ROTATION_REQUIRED:-1}
      - EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_PRODUCTION_ELIGIBLE=${EA_AUDIOBOOK_VOCALLAB_CREDENTIAL_PRODUCTION_ELIGIBLE:-0}
      - EA_AUDIOBOOK_VOCALLAB_BASE_URL=${EA_AUDIOBOOK_VOCALLAB_BASE_URL:-https://api.vocallab.ai}
      - EA_AUDIOBOOK_VOCALLAB_MODEL=${EA_AUDIOBOOK_VOCALLAB_MODEL:-v-pro}
      - EA_AUDIOBOOK_VOCALLAB_EXPRESSIVE_MODEL=${EA_AUDIOBOOK_VOCALLAB_EXPRESSIVE_MODEL:-v-studio}
      - EA_AUDIOBOOK_VOCALLAB_DRAFT_MODEL=${EA_AUDIOBOOK_VOCALLAB_DRAFT_MODEL:-v-lite}
      - EA_AUDIOBOOK_VOCALLAB_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_VOCALLAB_MAX_CHARS_PER_REQUEST:-1800}
      - EA_AUDIOBOOK_VOCALLAB_REQUESTS_PER_MINUTE=${EA_AUDIOBOOK_VOCALLAB_REQUESTS_PER_MINUTE:-30}
      - EA_AUDIOBOOK_VOCALLAB_MAX_IN_FLIGHT=${EA_AUDIOBOOK_VOCALLAB_MAX_IN_FLIGHT:-1}
      - EA_AUDIOBOOK_VOCALLAB_MAX_SEGMENTS_PER_RUN=${EA_AUDIOBOOK_VOCALLAB_MAX_SEGMENTS_PER_RUN:-10}
      - EA_AUDIOBOOK_VOCALLAB_TIMEOUT_SECONDS=${EA_AUDIOBOOK_VOCALLAB_TIMEOUT_SECONDS:-120}
      - EA_AUDIOBOOK_VOCALLAB_POLL_INTERVAL_SECONDS=${EA_AUDIOBOOK_VOCALLAB_POLL_INTERVAL_SECONDS:-2}
      - EA_AUDIOBOOK_VOCALLAB_POLL_TIMEOUT_SECONDS=${EA_AUDIOBOOK_VOCALLAB_POLL_TIMEOUT_SECONDS:-180}
      - EA_AUDIOBOOK_VOCALLAB_OUTPUT_FORMAT=${EA_AUDIOBOOK_VOCALLAB_OUTPUT_FORMAT:-WAV}
      - EA_AUDIOBOOK_VOCALLAB_SAMPLE_RATE=${EA_AUDIOBOOK_VOCALLAB_SAMPLE_RATE:-44100}
      - EA_AUDIOBOOK_VOCALLAB_MAX_AUDIO_BYTES=${EA_AUDIOBOOK_VOCALLAB_MAX_AUDIO_BYTES:-33554432}
      - EA_AUDIOBOOK_VOCALLAB_MIN_REMAINING_POINTS=${EA_AUDIOBOOK_VOCALLAB_MIN_REMAINING_POINTS:-3000}
      - EA_AUDIOBOOK_VOCALLAB_MAX_POINTS_PER_JOB=${EA_AUDIOBOOK_VOCALLAB_MAX_POINTS_PER_JOB:-6000}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_TOPUP_POINTS=${EA_AUDIOBOOK_VOCALLAB_ALLOW_TOPUP_POINTS:-0}
      - EA_AUDIOBOOK_VOCALLAB_ALLOWED_VOICE_CLASSES=${EA_AUDIOBOOK_VOCALLAB_ALLOWED_VOICE_CLASSES:-professional,consented_clone}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_COMMUNITY_VOICES=${EA_AUDIOBOOK_VOCALLAB_ALLOW_COMMUNITY_VOICES:-0}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_CLONES=${EA_AUDIOBOOK_VOCALLAB_ALLOW_CLONES:-0}
      - EA_AUDIOBOOK_VOCALLAB_ALLOW_MEMORIAL=${EA_AUDIOBOOK_VOCALLAB_ALLOW_MEMORIAL:-0}
      - EA_AUDIOBOOK_VOCALLAB_VOICE_CATALOG_FILE=${EA_AUDIOBOOK_VOCALLAB_VOICE_CATALOG_FILE:-config/vocallab_voice_catalog.local.json}
      - EA_AUDIOBOOK_TTS_PROVIDER_ORDER=${EA_AUDIOBOOK_TTS_PROVIDER_ORDER:-unmixr,vocallab,piper_local}
      - EA_AUDIOBOOK_TTS_ALLOW_CROSS_PROVIDER_FALLBACK=${EA_AUDIOBOOK_TTS_ALLOW_CROSS_PROVIDER_FALLBACK:-0}
      - EA_AUDIOBOOK_CINEMATIC_NARRATION=${EA_AUDIOBOOK_CINEMATIC_NARRATION:-1}
      - EA_AUDIOBOOK_CINEMATIC_SINGLE_PASS=${EA_AUDIOBOOK_CINEMATIC_SINGLE_PASS:-0}
      - EA_AUDIOBOOK_CINEMATIC_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_CINEMATIC_MAX_CHARS_PER_REQUEST:-1800}
      - EA_AUDIOBOOK_EBOOK_CONVERT_BIN=${EA_AUDIOBOOK_EBOOK_CONVERT_BIN:-ebook-convert}
      - EA_AUDIOBOOK_KINDLE_CONVERT_TIMEOUT_SECONDS=${EA_AUDIOBOOK_KINDLE_CONVERT_TIMEOUT_SECONDS:-900}
      - EA_GEMINI_VORTEX_CONFIG_DIR=${EA_GEMINI_VORTEX_CONFIG_DIR:-/run/ea-gemini-cli-config}
      - EA_GEMINI_VORTEX_HOME_ROOT=${EA_GEMINI_VORTEX_HOME_ROOT:-/tmp/ea-gemini-vortex}
      - EA_AUDIOBOOK_PARAGRAPH_PAUSES_ENABLED=${EA_AUDIOBOOK_PARAGRAPH_PAUSES_ENABLED:-1}
      - EA_AUDIOBOOK_PARAGRAPH_PAUSE_SECONDS=${EA_AUDIOBOOK_PARAGRAPH_PAUSE_SECONDS:-0.45}
      - EA_AUDIOBOOK_PUBLICATION_STT_GATE_REQUIRED=${EA_AUDIOBOOK_PUBLICATION_STT_GATE_REQUIRED:-1}
      - EA_AUDIOBOOK_PUBLICATION_STT_GATE_ENABLED=${EA_AUDIOBOOK_PUBLICATION_STT_GATE_ENABLED:-0}
      - EA_AUDIOBOOK_PUBLICATION_STT_COMMAND=${EA_AUDIOBOOK_PUBLICATION_STT_COMMAND:-}
      - EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_SECONDS=${EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_SECONDS:-30}
      - EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_COUNT=${EA_AUDIOBOOK_PUBLICATION_STT_SAMPLE_COUNT:-3}
      - EA_AUDIOBOOK_PUBLICATION_STT_MIN_BOOK_TOKEN_OVERLAP=${EA_AUDIOBOOK_PUBLICATION_STT_MIN_BOOK_TOKEN_OVERLAP:-0.55}
      - EA_AUDIOBOOK_VOICE_DISCOVERY_ENABLED=${EA_AUDIOBOOK_VOICE_DISCOVERY_ENABLED:-1}
      - EA_AUDIOBOOK_VOICE_DISCOVERY_TARGET_COUNT=${EA_AUDIOBOOK_VOICE_DISCOVERY_TARGET_COUNT:-30}
      - EA_AUDIOBOOK_VOICE_AUDITION_MIN_CANDIDATES=${EA_AUDIOBOOK_VOICE_AUDITION_MIN_CANDIDATES:-3}
      - EA_AUDIOBOOK_DEFAULT_VOICE_LABEL=${EA_AUDIOBOOK_DEFAULT_VOICE_LABEL:-Unmixr premium German narration voice}
      - EA_AUDIOBOOK_DEFAULT_VOICE_LANGUAGE=${EA_AUDIOBOOK_DEFAULT_VOICE_LANGUAGE:-de}
      - EA_AUDIOBOOK_DEFAULT_VOICE_TAGS=${EA_AUDIOBOOK_DEFAULT_VOICE_TAGS:-audiobook,narration,german,calm,warm,clear,nonfiction}
      - EA_AUDIOBOOK_M4B_AUTO_MERGE=${EA_AUDIOBOOK_M4B_AUTO_MERGE:-1}
      - EA_AUDIOBOOK_FFMPEG_M4B_FALLBACK=${EA_AUDIOBOOK_FFMPEG_M4B_FALLBACK:-1}
      - EA_AUDIOBOOKSHELF_AUTO_IMPORT=${EA_AUDIOBOOKSHELF_AUTO_IMPORT:-1}
      - EA_AUDIOBOOKSHELF_IMPORT_ROOT=${EA_AUDIOBOOKSHELF_IMPORT_ROOT:-/data/audiobooks/audiobookshelf}
      - EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT=${EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT:-./data/audiobooks/audiobookshelf}
      - EA_AUDIOBOOKSHELF_TRUST_LIBRARY_FOLDER_PATHS=${EA_AUDIOBOOKSHELF_TRUST_LIBRARY_FOLDER_PATHS:-0}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_ENABLED=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_ENABLED:-1}
      - EA_AUDIOBOOKSHELF_API_BASE_URL=${EA_AUDIOBOOKSHELF_API_BASE_URL:-}
      - EA_AUDIOBOOKSHELF_PUBLIC_BASE_URL=${EA_AUDIOBOOKSHELF_PUBLIC_BASE_URL:-}
      - EA_AUDIOBOOKSHELF_API_TOKEN=${EA_AUDIOBOOKSHELF_API_TOKEN:-}
      - EA_AUDIOBOOKSHELF_LIBRARY_ID=${EA_AUDIOBOOKSHELF_LIBRARY_ID:-}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_EXPIRES_DAYS=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_EXPIRES_DAYS:-30}
      - EA_AUDIOBOOKSHELF_PUBLIC_SHARE_DOWNLOADABLE=${EA_AUDIOBOOKSHELF_PUBLIC_SHARE_DOWNLOADABLE:-0}
      - EA_AUDIOBOOK_ACCESS_SIGNING_SECRET=${EA_SIGNING_SECRET:-}
      - EA_AUDIOBOOK_ACCESS_EXPIRES_DAYS=${EA_AUDIOBOOK_ACCESS_EXPIRES_DAYS:-30}
      - EA_AUDIOBOOK_PLAYER_ACCESS_BASE_URL=${EA_AUDIOBOOK_PLAYER_ACCESS_BASE_URL:-}
      - EA_WHATSAPP_AUDIOBOOK_CALLBACK_SECRET_FILE=/run/secrets/whatsapp_audiobook_callback_secret
      - HOME=/home/ea
      - EA_UI_SERVICE_SHARED_TEMP_ROOT=${EA_UI_SERVICE_SHARED_TEMP_ROOT:-/data/artifacts/browseract_ui_worker_shared}
      - VOICEWAVE_RUNTIME_TMP_ROOT=${VOICEWAVE_RUNTIME_TMP_ROOT:-/data/artifacts/voicewave_runtime_tmp}
      - TEABLE_BASE_URL=${TEABLE_RUNTIME_BASE_URL:-https://app.teable.ai}
      - TEABLE_TABLE_SYNC_CONFIG_JSON=${TEABLE_TABLE_SYNC_CONFIG_JSON:-}
      - TZ=Europe/Vienna
    ports:
      - "127.0.0.1:${EA_HOST_PORT:-8090}:8090"
    volumes:
      - ./config:/config:ro
      - ./config:/app/config:ro
      - ${EA_WHATSAPP_AUDIOBOOK_CALLBACK_SECRET_RUNTIME_FILE:-./.runtime/secrets/whatsapp_audiobook_callback_secret}:/run/secrets/whatsapp_audiobook_callback_secret:ro
      - ${EA_GEMINI_VORTEX_CONFIG_HOST_DIR:-/home/tibor/.gemini}:/run/ea-gemini-cli-config:ro
      - ./.codex-design:/app/.codex-design:ro
      - ./.codex-studio:/app/.codex-studio:ro
      # Mount one coherent source tree. Partial file overlays allowed stale
      # image modules and live modules to diverge after a restart.
      - ./ea/app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./scripts/materialize_whatsapp_web_action_processor_readiness.py:/app/scripts/materialize_whatsapp_web_action_processor_readiness.py:ro
      - ./docker-compose.whatsapp-web-session.yml:/app/docker-compose.whatsapp-web-session.yml:ro
      - ${EA_ONEDRIVE_ATTACHMENTS_HOST_PATH:-./data/onedrive_attachments}:/data/onedrive_attachments
      - ${EA_POCKET_AUDIO_ARCHIVE_HOST_ROOT:-./data/pocket-ai-audio}:/data/pocket-ai-audio
      - ${EA_DURABLE_AUDIOBOOK_HOST_ROOT:-./data/audiobooks}:/data/audiobooks
      - ${EA_AUDIOBOOK_JOBS_HOST_ROOT:-./data/audiobooks/jobs}:/data/audiobooks/jobs
      - ${EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT:-./data/audiobooks/audiobookshelf}:/data/audiobooks/audiobookshelf
      - ea_artifacts:/data/artifacts
      - ea_public_tours:/data/public_property_tours
      - ea_provider_ledger:/data/provider-ledger
      - ea_whatsapp_web_actions:/data/whatsapp-actions
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
      public_ingress:
        ipv4_address: ${EA_PUBLIC_INGRESS_API_IPV4:-172.31.254.3}
    depends_on:
      ea-teable-relay:
        condition: service_healthy
      ea-db:
        condition: service_healthy
      ea-redis:
        condition: service_healthy

  ea-responses-proxy:
    image: ea-runtime:latest
    container_name: ea-responses-proxy
    entrypoint: ["/bin/sh", "-ec", "umask 0007; exec /usr/local/bin/docker-entrypoint.sh \"$@\"", "--"]
    group_add: ["1000"]
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    cpu_shares: ${EA_RESPONSES_PROXY_CPU_SHARES:-128}
    cpus: ${EA_RESPONSES_PROXY_CPUS:-0.75}
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
      - path: .ea-runtime-secrets/ea_runtime.local.env
        required: false
    environment:
      - EA_ROLE=api
      - VOCALLAB_API_KEY=
      - VOCALLAB_API_KEY_FILE=
      - EA_RESPONSES_PROXY_HOST=0.0.0.0
      - EA_RESPONSES_PROXY_PORT=8091
      - EA_ARTIFACTS_DIR=/data/artifacts
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/provider-ledger
      - EA_OUTBOUND_EMAIL_GUARD_STATE_PATH=${EA_OUTBOUND_EMAIL_GUARD_STATE_PATH:-/data/provider-ledger/outbound_email_guard.json}
      - EA_EMAILIT_MAX_429_RETRY_ATTEMPTS=${EA_EMAILIT_MAX_429_RETRY_ATTEMPTS:-0}
      - EA_ONEDRIVE_ATTACHMENT_ROOT=/data/onedrive_attachments
      - EA_POCKET_AUDIO_ARCHIVE_ROOT=${EA_POCKET_AUDIO_ARCHIVE_ROOT:-/data/pocket-ai-audio}
      - EA_AUDIOBOOK_DURABLE_STORAGE_ROOT=${EA_AUDIOBOOK_DURABLE_STORAGE_ROOT:-/data/audiobooks}
      - EA_AUDIOBOOK_JOBS_ROOT=${EA_AUDIOBOOK_JOBS_ROOT:-/data/audiobooks/jobs}
      - EA_AUDIOBOOKSHELF_IMPORT_ROOT=${EA_AUDIOBOOKSHELF_IMPORT_ROOT:-/data/audiobooks/audiobookshelf}
      - EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT=${EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT:-./data/audiobooks/audiobookshelf}
      - EA_AUDIOBOOKSHELF_TRUST_LIBRARY_FOLDER_PATHS=${EA_AUDIOBOOKSHELF_TRUST_LIBRARY_FOLDER_PATHS:-0}
      - EA_UI_SERVICE_SHARED_TEMP_ROOT=${EA_UI_SERVICE_SHARED_TEMP_ROOT:-/data/artifacts/browseract_ui_worker_shared}
      - VOICEWAVE_RUNTIME_TMP_ROOT=${VOICEWAVE_RUNTIME_TMP_ROOT:-/data/artifacts/voicewave_runtime_tmp}
      - HOME=/home/ea
      - PYTHONPATH=/app
      - TZ=Europe/Vienna
    ports:
      - "127.0.0.1:${EA_RESPONSES_PROXY_HOST_PORT:-8092}:8091"
    volumes:
      - type: tmpfs
        target: /config
        tmpfs:
          size: 65536
          mode: 365
      - type: tmpfs
        target: /app/config
        tmpfs:
          size: 65536
          mode: 365
      - type: bind
        source: ./config/onemin_api_keys.example.json
        target: /config/onemin_api_keys.example.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_api_keys.example.json
        target: /app/config/onemin_api_keys.example.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_slot_owners.json
        target: /config/onemin_slot_owners.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/onemin_slot_owners.json
        target: /app/config/onemin_slot_owners.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/places.yml
        target: /config/places.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/places.yml
        target: /app/config/places.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/tenants.yml
        target: /config/tenants.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/tenants.yml
        target: /app/config/tenants.yml
        read_only: true
        bind:
          create_host_path: false
      - ./ea/app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ${EA_ONEDRIVE_ATTACHMENTS_HOST_PATH:-./data/onedrive_attachments}:/data/onedrive_attachments
      - ${EA_POCKET_AUDIO_ARCHIVE_HOST_ROOT:-./data/pocket-ai-audio}:/data/pocket-ai-audio
      - ${EA_DURABLE_AUDIOBOOK_HOST_ROOT:-./data/audiobooks}:/data/audiobooks
      - ${EA_AUDIOBOOK_JOBS_HOST_ROOT:-./data/audiobooks/jobs}:/data/audiobooks/jobs
      - ${EA_AUDIOBOOKSHELF_IMPORT_HOST_ROOT:-./data/audiobooks/audiobookshelf}:/data/audiobooks/audiobookshelf
      - ea_artifacts:/data/artifacts
      - ea_public_tours:/data/public_property_tours
      - ea_provider_ledger:/data/provider-ledger
      - type: tmpfs
        target: /data/provider-ledger/vocallab
        tmpfs:
          size: 65536
          mode: 365
    pids_limit: 512
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    command:
      - /bin/sh
      - /app/scripts/ea_responses_proxy_start_guard.sh
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --connect-timeout 2 --max-time 10 http://127.0.0.1:8091/health/ready >/dev/null
      interval: 2m
      timeout: 10s
      retries: 5
    depends_on:
      ea-db:
        condition: service_healthy

  ea-worker:
    build:
      context: .
      dockerfile: ea/Dockerfile
    image: ea-runtime:latest
    container_name: ea-worker
    entrypoint: ["/bin/sh", "-ec", "umask 0007; exec /usr/local/bin/docker-entrypoint.sh \"$@\"", "--"]
    command: ["python", "-m", "app.runner"]
    group_add: ["1000"]
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    cpu_shares: ${EA_WORKER_CPU_SHARES:-128}
    cpus: ${EA_WORKER_CPUS:-0.75}
    env_file:
      - .ea-runtime-secrets/ea_runtime.env
      - path: .ea-runtime-secrets/ea_runtime.local.env
        required: false
    environment:
      - EA_ROLE=worker
      - EA_ARTIFACTS_DIR=/data/artifacts
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/provider-ledger
      - EA_OUTBOUND_EMAIL_GUARD_STATE_PATH=${EA_OUTBOUND_EMAIL_GUARD_STATE_PATH:-/data/provider-ledger/outbound_email_guard.json}
      - EA_EMAILIT_MAX_429_RETRY_ATTEMPTS=${EA_EMAILIT_MAX_429_RETRY_ATTEMPTS:-0}
