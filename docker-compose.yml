      - ./ea/app/api/routes:/app/app/api/routes:ro
      - ./ea/app/api/routes/channels.py:/app/app/api/routes/channels.py:ro
      - ./ea/app/api/routes/health.py:/app/app/api/routes/health.py:ro
      - ./ea/app/api/routes/responses.py:/app/app/api/routes/responses.py:ro
