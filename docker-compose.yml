services:
  ea-teable-relay:
    build:
      context: .
      dockerfile: ea/Dockerfile
    image: ea-teable-relay:latest
    container_name: ea-teable-relay
    restart: unless-stopped
    env_file:
      - .env
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      - TEABLE_RELAY_LISTEN_HOST=${TEABLE_RELAY_LISTEN_HOST:-172.17.0.1}
      - TZ=Europe/Vienna
    network_mode: host
    command:
      - python3
      - /app/scripts/teable_host_proxy.py
      - --listen-host
      - ${TEABLE_RELAY_LISTEN_HOST:-172.17.0.1}
      - --listen-port
      - "18787"
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --connect-timeout 2 --max-time 10 http://${TEABLE_RELAY_LISTEN_HOST:-172.17.0.1}:18787/healthz >/dev/null
      interval: 2m
      timeout: 10s
      retries: 5

  ea-api:
    build:
      context: .
      dockerfile: ea/Dockerfile
    image: ea-runtime:latest
    container_name: ea-api
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    cpu_shares: ${EA_API_CPU_SHARES:-512}
    cpus: ${EA_API_CPUS:-2.0}
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      - EA_ROLE=api
      - EA_PORT=8090
      - EA_ASSISTANT_OWNER_LABEL=${EA_ASSISTANT_OWNER_LABEL:-the principal}
      - EA_API_TOKEN=${EA_API_TOKEN:-}
      - EA_ALLOW_LOOPBACK_NO_AUTH=${EA_ALLOW_LOOPBACK_NO_AUTH:-0}
      - EA_ENABLE_LEGACY_RUNTIME_SURFACES=${EA_ENABLE_LEGACY_RUNTIME_SURFACES:-1}
      - EA_ARTIFACTS_DIR=/data/artifacts
      - EA_RESPONSES_PROVIDER_LEDGER_DIR=/data/provider-ledger
      - EA_ONEDRIVE_ATTACHMENT_ROOT=/data/onedrive_attachments
      - EA_POCKET_AUDIO_ARCHIVE_ROOT=${EA_POCKET_AUDIO_ARCHIVE_ROOT:-/data/pocket-ai-audio}
      - EA_ANSWERLY_AUTO_IMPORT_GMAIL_PDFS=${EA_ANSWERLY_AUTO_IMPORT_GMAIL_PDFS:-1}
      - EA_TELEGRAM_AUDIOBOOK_EPUB_ENABLED=${EA_TELEGRAM_AUDIOBOOK_EPUB_ENABLED:-1}
      - EA_AUDIOBOOK_DURABLE_STORAGE_ROOT=${EA_AUDIOBOOK_DURABLE_STORAGE_ROOT:-/data/audiobooks}
      - EA_AUDIOBOOK_JOBS_ROOT=${EA_AUDIOBOOK_JOBS_ROOT:-/data/audiobooks/jobs}
      - EA_AUDIOBOOK_EXTERNAL_TTS_ENABLED=${EA_AUDIOBOOK_EXTERNAL_TTS_ENABLED:-1}
      - EA_AUDIOBOOK_UNMIXR_AUTO_RENDER=${EA_AUDIOBOOK_UNMIXR_AUTO_RENDER:-1}
      - EA_AUDIOBOOK_UNMIXR_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_UNMIXR_MAX_CHARS_PER_REQUEST:-1800}
      - EA_AUDIOBOOK_CINEMATIC_NARRATION=${EA_AUDIOBOOK_CINEMATIC_NARRATION:-1}
      - EA_AUDIOBOOK_CINEMATIC_SINGLE_PASS=${EA_AUDIOBOOK_CINEMATIC_SINGLE_PASS:-1}
      - EA_AUDIOBOOK_CINEMATIC_MAX_CHARS_PER_REQUEST=${EA_AUDIOBOOK_CINEMATIC_MAX_CHARS_PER_REQUEST:-50000}
      - EA_AUDIOBOOK_EBOOK_CONVERT_BIN=${EA_AUDIOBOOK_EBOOK_CONVERT_BIN:-ebook-convert}
      - EA_AUDIOBOOK_KINDLE_CONVERT_TIMEOUT_SECONDS=${EA_AUDIOBOOK_KINDLE_CONVERT_TIMEOUT_SECONDS:-900}
      - EA_GEMINI_VORTEX_CONFIG_DIR=${EA_GEMINI_VORTEX_CONFIG_DIR:-/run/ea-gemini-cli-config}
      - EA_GEMINI_VORTEX_HOME_ROOT=${EA_GEMINI_VORTEX_HOME_ROOT:-/tmp/ea-gemini-vortex}
